services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env (veja o .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env (veja o .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?defina POSTGRES_USER no .env (veja o .env.example)} -d ${POSTGRES_DB:?defina POSTGRES_DB no .env (veja o .env.example)}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env (veja o .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (veja o .env.example)}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment: &app-env
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env (veja o .env.example)}
      DB_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env (veja o .env.example)}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o .env.example)}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env (veja o .env.example)}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (veja o .env.example)}
      SPRING_PROFILES_ACTIVE: api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: .
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:?defina PROVIDER_BASE_URL no .env (veja o .env.example)}
    ports:
      - "127.0.0.1:8081:8081"
    # Espera a api para não disputar a execução das migrações Flyway na subida, e o provedor para não mandar
    # as primeiras solicitações para a DLQ.
    depends_on:
      api:
        condition: service_healthy
      provider-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Mesmo código e imagem de api e worker, no perfil webhook: só RabbitMQ, sem banco.
  invoice-webhook:
    build: .
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env (veja o .env.example)}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env (veja o .env.example)}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?defina WEBHOOK_HMAC_SECRET no .env (veja o .env.example)}
      SPRING_PROFILES_ACTIVE: webhook
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Provedor externo simulado: projeto separado, só HTTP. Recebe a solicitação do worker e chama o webhook.
  provider-simulator:
    build: ./provider-simulator
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:?defina WEBHOOK_URL no .env (veja o .env.example)}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?defina WEBHOOK_HMAC_SECRET no .env (veja o .env.example)}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      invoice-webhook:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
