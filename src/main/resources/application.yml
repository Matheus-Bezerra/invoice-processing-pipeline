spring:
  application:
    name: invoice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice}
    username: ${DB_USER:invoice}
    password: ${DB_PASSWORD:invoice_dev}
    hikari:
      # Espera máxima para pegar uma conexão do pool (não limita a consulta). O padrão é 30s; com o banco fora,
      # cada tentativa do consumer de resultado perderia 30s antes do retry.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:invoice}
    password: ${RABBITMQ_PASSWORD:invoice_dev}
    # O padrão é 60s; com o broker fora, a publicação imediata seguraria o POST por esse tempo.
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}
    # Publisher confirm correlacionado + returns: a linha do outbox só é apagada com ack e sem devolução.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

invoice:
  outbox:
    relay:
      tick: ${OUTBOX_RELAY_TICK:5s}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      max-backoff: ${OUTBOX_RELAY_MAX_BACKOFF:60s}
  messaging:
    confirm-timeout: ${PUBLISHER_CONFIRM_TIMEOUT:5s}
    # Consumer de resultado (worker): erro técnico faz 3 retries com esperas de 2s, 4s e 8s e depois vai para a DLQ.
    result-retry:
      max-retries: ${RESULT_RETRY_MAX_RETRIES:3}
      initial-interval: ${RESULT_RETRY_INITIAL_INTERVAL:2s}
      multiplier: ${RESULT_RETRY_MULTIPLIER:2.0}
      max-interval: ${RESULT_RETRY_MAX_INTERVAL:8s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
